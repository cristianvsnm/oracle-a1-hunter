name: Oracle A1 Hunter

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest

    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_REGION: sa-santiago-1

    steps:

      # ============================================================
      # 1. Comprobar autenticacion
      # ============================================================

      - name: Comprobar autenticacion OCI
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        id: auth
        with:
          command: 'iam region list'
          query: 'data[0]."name"'

      - name: Mostrar region autenticada
        run: |
          echo "Autenticacion OCI correcta."
          echo "Region: ${{ steps.auth.outputs.raw_output }}"


      # ============================================================
      # 2. Buscar Minecraft-Server
      # ============================================================

      - name: Buscar Minecraft-Server
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        id: check
        with:
          command: 'compute instance list --compartment-id ${{ secrets.OCI_TENANCY_OCID }} --display-name Minecraft-Server --all'
          query: 'length(data)'

      - name: Mostrar resultado de busqueda
        run: |
          echo "Resultado de busqueda:"
          echo "Instancias encontradas: ${{ steps.check.outputs.raw_output }}"


      # ============================================================
      # 3. Crear instancia si no existe
      # ============================================================

      - name: Crear A1
        if: steps.check.outputs.raw_output == '0'
        env:
          TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |

          cat > launch.json <<EOF
          {
            "compartmentId": "$TENANCY",
            "availabilityDomain": "hCBe:SA-SANTIAGO-1-AD-1",
            "subnetId": "ocid1.subnet.oc1.sa-santiago-1.aaaaaaaaasyt2fbayfh4dajopuckixys4d7hk5grd5zpxjavlui5k4nxx6da",
            "shape": "VM.Standard.A1.Flex",
            "shapeConfig": {
              "ocpus": 2.0,
              "memoryInGBs": 12.0
            },
            "displayName": "Minecraft-Server",
            "assignPublicIp": true,
            "sshAuthorizedKeys": "$SSH_PUBLIC_KEY",
            "sourceDetails": {
              "sourceType": "image",
              "imageId": "ocid1.image.oc1.sa-santiago-1.aaaaaaaaqsi25a3dcxzdtdsra64vtyqdm7bo6oqfxvshxa5uidgihgaob5jq",
              "bootVolumeSizeInGBs": 50
            }
          }
          EOF

          echo "=========================================="
          echo "Intentando crear Minecraft-Server"
          echo "A1 Flex - 2 OCPU / 12 GB RAM"
          echo "=========================================="
          echo ""

          set +e

          OUTPUT=$(oci compute instance launch \
            --from-json file://launch.json \
            --output json 2>&1)

          STATUS=$?

          echo "$OUTPUT"

          # --------------------------------------------------------
          # Creacion correcta
          # --------------------------------------------------------

          if [ "$STATUS" -eq 0 ]; then
            echo ""
            echo "=========================================="
            echo "       A1 CREADA CORRECTAMENTE"
            echo "=========================================="
            echo ""
            echo "Oracle encontro capacidad."
            echo "Minecraft-Server fue creada."
            exit 0
          fi

          # --------------------------------------------------------
          # Sin capacidad
          # --------------------------------------------------------

          if echo "$OUTPUT" | grep -qiE \
            "Out of host capacity|Out of capacity|OutOfHostCapacity"; then

            echo ""
            echo "=========================================="
            echo "          SIN CAPACIDAD A1"
            echo "=========================================="
            echo ""
            echo "Oracle no tiene capacidad disponible."
            echo "El Hunter volvera a intentarlo en aproximadamente 5 minutos."
            exit 0
          fi

          # --------------------------------------------------------
          # Otro error
          # --------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "       ERROR DE ORACLE OCI"
          echo "=========================================="
          echo ""
          echo "Oracle devolvio un error diferente."
          exit 1


      # ============================================================
      # 4. Ya existe
      # ============================================================

      - name: Minecraft-Server ya existe
        if: steps.check.outputs.raw_output != '0'
        run: |
          echo "=========================================="
          echo "     MINECRAFT-SERVER YA EXISTE"
          echo "=========================================="
          echo ""
          echo "El Hunter no creara otra instancia."
