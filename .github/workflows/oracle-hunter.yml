name: Oracle A1 Flex Hunter

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: oracle-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI CLI
        run: |
          pip install --quiet oci-cli
          oci --version

      - name: Configure OCI credentials
        env:
          OCI_FINGERPRINT:  ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY:  ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID:    ${{ secrets.OCI_USER_OCID }}
          OCI_REGION:       ${{ secrets.OCI_REGION }}
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 "$HOME/.oci/config"

      - name: Write and validate launch.json
        env:
          LAUNCH_JSON:        ${{ secrets.LAUNCH_JSON }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          printf '%s' "$LAUNCH_JSON" > launch.raw.json

          python - <<'PY'
          import json, os, sys

          raw = open('launch.raw.json', 'rb').read()
          try:
              d = json.loads(raw.decode('utf-8'))
          except Exception as e:
              print("ERROR: launch.json inválido:", e)
              sys.exit(1)

          print("=== launch.json (claves top-level) ===")
          for k in d:
              print(" -", k)

          def norm_key(k):
              return k.replace('-', '').lower()

          canonical = {}
          for k, v in d.items():
              canonical[norm_key(k)] = (k, v)

          def get(*names):
              for n in names:
                  if norm_key(n) in canonical:
                      return canonical[norm_key(n)][1]
              return None

          compartment = get('compartmentId', 'compartment-id')
          ad          = get('availabilityDomain', 'availability-domain')
          shape       = get('shape')
          shape_cfg   = get('shapeConfig', 'shape-config')
          source      = get('sourceDetails', 'source-details')
          vnic        = get('createVnicDetails', 'create-vnic-details')
          display     = get('displayName', 'display-name') or 'minecraft-server'
          metadata    = get('metadata') or {}

          if not all([compartment, ad, shape, shape_cfg, source, vnic]):
              print("ERROR: faltan claves obligatorias.")
              sys.exit(1)

          shape_cfg_norm = {}
          for k, v in shape_cfg.items():
              shape_cfg_norm[norm_key(k)] = v
          ocpus = shape_cfg_norm.get('ocpus')
          mem   = shape_cfg_norm.get('memoryingbs') or shape_cfg_norm.get('memoryingb')
          if ocpus is None or mem is None:
              print("ERROR: shape-config necesita ocpus y memory-in-gbs"); sys.exit(1)

          src_norm = { norm_key(k): v for k, v in source.items() }
          source_type = src_norm.get('sourcetype') or 'image'
          image_id    = src_norm.get('imageid')
          bv_size     = src_norm.get('bootvolumesizeingbs') or 50
          if not image_id:
              print("ERROR: source-details.image-id faltante"); sys.exit(1)

          vnic_norm = { norm_key(k): v for k, v in vnic.items() }
          subnet_id  = vnic_norm.get('subnetid')
          assign_pub = vnic_norm.get('assignpublicip', True)
          if not subnet_id:
              print("ERROR: create-vnic-details.subnet-id faltante"); sys.exit(1)

          ssh_key = os.environ.get('OCI_SSH_PUBLIC_KEY', '').strip()
          if not ssh_key:
              ssh_key = metadata.get('ssh_authorized_keys', '').strip()
          if not ssh_key:
              print("ERROR: no hay SSH public key"); sys.exit(1)

          # Guardar todos los valores para el shell
          with open('subnet.txt', 'w') as f:         f.write(subnet_id)
          with open('ad.txt', 'w') as f:             f.write(ad)
          with open('compartment.txt', 'w') as f:    f.write(compartment)
          with open('shape.txt', 'w') as f:          f.write(shape)
          with open('ocpus.txt', 'w') as f:          f.write(str(ocpus))
          with open('memory.txt', 'w') as f:         f.write(str(mem))
          with open('image.txt', 'w') as f:          f.write(image_id)
          with open('bvsize.txt', 'w') as f:         f.write(str(bv_size))
          with open('displayname.txt', 'w') as f:    f.write(display)
          with open('sshkey.txt', 'w') as f:         f.write(ssh_key)

          print()
          print("=== Valores extraídos ===")
          print("compartment:", compartment)
          print("ad:         ", ad)
          print("shape:      ", shape)
          print("ocpus:      ", ocpus)
          print("memory:     ", mem, "GB")
          print("image:      ", image_id)
          print("subnet:     ", subnet_id)
          print("display:    ", display)
          print("OK: valores extraídos.")
          PY

      - name: Run hunter
        env:
          OCI_TENANCY_OCID:    ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION:          ${{ secrets.OCI_REGION }}
        run: |
          chmod +x ./hunter.sh
          export OCI_SUBNET_ID="$(cat subnet.txt)"
          export OCI_AD="$(cat ad.txt)"
          export OCI_COMPARTMENT_ID="$(cat compartment.txt)"
          export OCI_SHAPE="$(cat shape.txt)"
          export OCI_OCPUS="$(cat ocpus.txt)"
          export OCI_MEMORY_GB="$(cat memory.txt)"
          export OCI_IMAGE_ID="$(cat image.txt)"
          export OCI_BOOT_VOLUME_GB="$(cat bvsize.txt)"
          export OCI_DISPLAY_NAME="$(cat displayname.txt)"
          export OCI_SSH_KEY="$(cat sshkey.txt)"
          ./hunter.sh

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-${{ github.run_id }}
          path: |
            launch.json
            launch.raw.json
            resultado.json
            hunter.log
          if-no-files-found: ignore
