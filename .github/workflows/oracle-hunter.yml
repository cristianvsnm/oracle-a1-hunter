name: Oracle A1 Flex Hunter

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: oracle-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # PYTHON
      # ==========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ==========================================================
      # OCI CLI
      # ==========================================================
      - name: Instalar OCI CLI
        run: |
          python -m pip install --upgrade pip
          pip install --quiet oci-cli
          oci --version


      # ==========================================================
      # CREDENCIALES OCI
      # ==========================================================
      - name: Configurar credenciales OCI
        env:
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          mkdir -p "$HOME/.oci"

          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"

          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF

          chmod 600 "$HOME/.oci/config"

          echo "Configuracion OCI creada correctamente."


      # ==========================================================
      # COMPROBAR AUTENTICACION
      # ==========================================================
      - name: Comprobar autenticacion OCI
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          echo "============================================"
          echo " COMPROBANDO OCI"
          echo "============================================"
          echo ""

          oci iam region list \
            --query "data[?name=='$OCI_REGION'].name" \
            --output json

          echo ""
          echo "Autenticacion OCI correcta."


      # ==========================================================
      # PREPARAR LAUNCH JSON
      #
      # LAUNCH_JSON contiene el JSON completo generado desde
      # Windows.
      #
      # Aqui solamente corregimos la ruta de SSH para que sea
      # valida dentro del runner Ubuntu.
      # ==========================================================
      - name: Preparar launch.json
        env:
          LAUNCH_JSON: ${{ secrets.LAUNCH_JSON }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          printf '%s' "$LAUNCH_JSON" > launch.raw.json

          printf '%s\n' "$OCI_SSH_PUBLIC_KEY" > ssh_authorized_keys.pub

          chmod 600 launch.raw.json
          chmod 644 ssh_authorized_keys.pub

          python - <<'PY'
          import json
          import sys

          input_file = "launch.raw.json"
          output_file = "launch-request.json"

          try:
              with open(input_file, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as e:
              print("ERROR: LAUNCH_JSON no contiene JSON valido.")
              print(e)
              sys.exit(1)

          if not isinstance(data, dict):
              print("ERROR: LAUNCH_JSON debe ser un objeto JSON.")
              sys.exit(1)

          # ------------------------------------------------------
          # Normalizar las posibles variantes de nombres
          # ------------------------------------------------------
          def find_key(*names):
              for name in names:
                  if name in data:
                      return name
              return None

          # ------------------------------------------------------
          # Comprobaciones
          # ------------------------------------------------------
          required = [
              "compartmentId",
              "availabilityDomain",
              "subnetId",
              "shape",
              "shapeConfig",
              "sourceDetails"
          ]

          missing = [key for key in required if key not in data]

          if missing:
              print("ERROR: faltan campos obligatorios en LAUNCH_JSON:")
              for key in missing:
                  print(" -", key)
              sys.exit(1)

          # ------------------------------------------------------
          # SSH
          #
          # El JSON original fue generado en Windows y puede
          # contener C:\Users\...
          #
          # Lo reemplazamos por el archivo que acabamos de crear
          # dentro del runner Linux.
          # ------------------------------------------------------
          data["sshAuthorizedKeysFile"] = "ssh_authorized_keys.pub"

          # Si venia metadata con ssh_authorized_keys, eliminamos
          # esa posibilidad para evitar duplicidad.
          metadata_key = find_key("metadata")

          if metadata_key is not None:
              metadata = data.get(metadata_key)

              if isinstance(metadata, dict):
                  metadata.pop("ssh_authorized_keys", None)

                  if not metadata:
                      data.pop(metadata_key, None)

          # ------------------------------------------------------
          # Nombre fijo del servidor
          # ------------------------------------------------------
          data["displayName"] = "Minecraft-Server"

          # ------------------------------------------------------
          # Guardar JSON final
          # ------------------------------------------------------
          with open(output_file, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print("============================================")
          print(" LAUNCH JSON PREPARADO")
          print("============================================")
          print("")
          print("Archivo:", output_file)
          print("Shape:", data.get("shape"))
          print("DisplayName:", data.get("displayName"))
          print("AvailabilityDomain:", data.get("availabilityDomain"))
          print("Subnet:", data.get("subnetId"))
          print("Image:", data.get("sourceDetails", {}).get("imageId"))
          print("OCPUs:", data.get("shapeConfig", {}).get("ocpus"))
          print("RAM:", data.get("shapeConfig", {}).get("memoryInGBs"), "GB")
          print("SSH:", data.get("sshAuthorizedKeysFile"))
          print("")
          print("JSON valido.")
          PY


      # ==========================================================
      # VALIDAR EL LAUNCH JSON SIN CREAR NADA
      # ==========================================================
      - name: Validar launch-request.json
        run: |
          python -m json.tool launch-request.json > /dev/null

          echo "============================================"
          echo " launch-request.json VALIDO"
          echo "============================================"


      # ==========================================================
      # EJECUTAR HUNTER
      # ==========================================================
      - name: Ejecutar Hunter
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_DISPLAY_NAME: Minecraft-Server
          INTERVAL_SECONDS: 120
        run: |
          chmod +x ./hunter.sh
          ./hunter.sh


      # ==========================================================
      # GUARDAR RESULTADOS
      # ==========================================================
      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-${{ github.run_id }}
          path: |
            launch.raw.json
            launch-request.json
            ssh_authorized_keys.pub
            resultado.json
            hunter.log
          if-no-files-found: ignore
