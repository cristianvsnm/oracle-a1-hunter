name: Oracle A1 Hunter

on:
  workflow_dispatch:

jobs:
  hunter:
    runs-on: ubuntu-latest

    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_REGION: sa-santiago-1

    steps:
      - name: Comprobar autenticacion OCI
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          command: 'iam region list'

      - name: Buscar Minecraft-Server
        id: check
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          command: 'compute instance list --compartment-id ${{ secrets.OCI_TENANCY_OCID }} --display-name Minecraft-Server --all'
          query: 'data[0].id || `NONE`'

      - name: Mostrar resultado
        run: |
          echo "=========================================="
          echo "RESULTADO"
          echo "=========================================="
          echo ""
          echo "raw_output:"
          echo "'${{ steps.check.outputs.raw_output }}'"
          echo ""
          echo "output:"
          echo "'${{ steps.check.outputs.output }}'"
          echo ""
          echo "=========================================="

          if [ "${{ steps.check.outputs.raw_output }}" = "NONE" ]; then
            echo "NO EXISTE Minecraft-Server."
            echo "Esto es correcto: el Hunter debe intentar crearla."
          else
            echo "Minecraft-Server EXISTE."
            echo "El Hunter no debe crear otra."
          fi

          echo "=========================================="
