name: Oracle A1 Hunter

on:
  workflow_dispatch:

jobs:
  hunter:
    runs-on: ubuntu-latest

    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: sa-santiago-1

    steps:

      - name: Instalar OCI SDK de Python
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install oci

      - name: Comprobar autenticacion OCI
        run: |
          python3 <<'PY'
          import os
          import oci

          tenancy = os.environ["OCI_TENANCY_OCID"]
          user = os.environ["OCI_USER_OCID"]
          fingerprint = os.environ["OCI_FINGERPRINT"]
          private_key = os.environ["OCI_PRIVATE_KEY"]
          region = os.environ["OCI_REGION"]

          signer = oci.signer.Signer(
              tenancy=tenancy,
              user=user,
              fingerprint=fingerprint,
              private_key_file_location=None,
              private_key_content=private_key
          )

          identity = oci.identity.IdentityClient(
              {"region": region},
              signer=signer
          )

          regions = identity.list_regions().data

          print("Autenticacion OCI correcta.")
          print("Region solicitada:", region)

          encontrada = any(r.name == region for r in regions)

          if not encontrada:
              raise RuntimeError(
                  f"La region {region} no fue encontrada en la cuenta."
              )

          print("Region autenticada correctamente.")
          PY

      - name: Buscar Minecraft-Server
        id: check
        run: |
          python3 <<'PY'
          import os
          import json
          import oci

          tenancy = os.environ["OCI_TENANCY_OCID"]
          user = os.environ["OCI_USER_OCID"]
          fingerprint = os.environ["OCI_FINGERPRINT"]
          private_key = os.environ["OCI_PRIVATE_KEY"]
          region = os.environ["OCI_REGION"]

          signer = oci.signer.Signer(
              tenancy=tenancy,
              user=user,
              fingerprint=fingerprint,
              private_key_file_location=None,
              private_key_content=private_key
          )

          compute = oci.core.ComputeClient(
              {"region": region},
              signer=signer
          )

          response = compute.list_instances(
              compartment_id=tenancy,
              display_name="Minecraft-Server"
          )

          instances = response.data

          print("==========================================")
          print("RESULTADO DE BUSQUEDA")
          print("==========================================")
          print("")
          print("Instancias encontradas:", len(instances))
          print("")

          if len(instances) == 0:
              print("NO EXISTE Minecraft-Server.")
              print("Esto es lo esperado.")
              print("")
          else:
              print("Minecraft-Server EXISTE.")
              print("No se debe crear otra instancia.")
              print("")

              for instance in instances:
                  print("Nombre :", instance.display_name)
                  print("OCID   :", instance.id)
                  print("Estado :", instance.lifecycle_state)
                  print("Shape  :", instance.shape)
                  print("")

          print("==========================================")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"instance_count={len(instances)}\n")

              if len(instances) == 0:
                  f.write("instance_exists=false\n")
              else:
                  f.write("instance_exists=true\n")
          PY

      - name: Comprobar deteccion
        run: |
          echo "=========================================="
          echo "COMPROBACION FINAL"
          echo "=========================================="
          echo ""
          echo "Cantidad de instancias: ${{ steps.check.outputs.instance_count }}"
          echo "Existe Minecraft-Server: ${{ steps.check.outputs.instance_exists }}"
          echo ""

          if [ "${{ steps.check.outputs.instance_exists }}" = "false" ]; then
            echo "CORRECTO:"
            echo "No existe Minecraft-Server."
            echo "El siguiente paso del Hunter sera intentar crear la A1."
          else
            echo "CORRECTO:"
            echo "Minecraft-Server ya existe."
            echo "El Hunter no debe crear otra."
          fi

          echo ""
          echo "=========================================="

      - name: Prueba terminada
        run: |
          echo ""
          echo "=========================================="
          echo "PRUEBA TERMINADA"
          echo "=========================================="
          echo ""
          echo "Todavia NO se intentara crear la A1."
          echo "Primero confirmamos que la deteccion funciona correctamente."
          echo ""
          echo "=========================================="
