name: Oracle A1 Flex Hunter

on:
  schedule:
    # Cada 15 minutos (mínimo de GitHub Actions)
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: oracle-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI CLI
        run: |
          pip install --quiet oci-cli
          oci --version

      - name: Configure OCI credentials
        env:
          OCI_FINGERPRINT:  ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY:  ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID:    ${{ secrets.OCI_USER_OCID }}
          OCI_REGION:       ${{ secrets.OCI_REGION }}
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 "$HOME/.oci/config"

      - name: Write and validate launch.json
        env:
          LAUNCH_JSON:      ${{ secrets.LAUNCH_JSON }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          printf '%s' "$LAUNCH_JSON" > launch.json

          python - <<'PY'
          import json, os, sys

          try:
              d = json.load(open('launch.json'))
          except Exception as e:
              print("ERROR: launch.json inválido:", e)
              sys.exit(1)

          # Rechaza claves de Windows que no sirven con --from-json
          if 'ssh-authorized-keys-file' in d:
              print("ERROR: quita 'ssh-authorized-keys-file' del launch.json")
              sys.exit(1)

          # Inyecta la SSH pública desde el secret (por si no está en el JSON)
          ssh_key = os.environ.get('OCI_SSH_PUBLIC_KEY', '').strip()
          if ssh_key:
              d.setdefault('metadata', {})['ssh_authorized_keys'] = ssh_key

          # Validaciones mínimas
          required = ['compartment-id', 'availability-domain', 'shape',
                      'shape-config', 'source-details', 'create-vnic-details']
          missing = [k for k in required if k not in d]
          if missing:
              print("ERROR: faltan claves en launch.json:", missing)
              sys.exit(1)

          if 'metadata' not in d or 'ssh_authorized_keys' not in d['metadata']:
              print("ERROR: falta metadata.ssh_authorized_keys")
              sys.exit(1)

          json.dump(d, open('launch.json', 'w'), indent=2)
          print("launch.json validado y normalizado OK")
          PY

      - name: Run hunter
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION:       ${{ secrets.OCI_REGION }}
        run: |
          chmod +x ./hunter.sh
          ./hunter.sh

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-${{ github.run_id }}
          path: |
            resultado.json
            hunter.log
          if-no-files-found: ignore
