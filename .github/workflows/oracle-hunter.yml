name: Oracle A1 Flex Hunter

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: oracle-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI CLI
        run: |
          pip install --quiet oci-cli
          oci --version

      - name: Configure OCI credentials
        env:
          OCI_FINGERPRINT:  ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY:  ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID:    ${{ secrets.OCI_USER_OCID }}
          OCI_REGION:       ${{ secrets.OCI_REGION }}
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 "$HOME/.oci/config"

      - name: Write and validate launch.json
        env:
          LAUNCH_JSON:        ${{ secrets.LAUNCH_JSON }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          # Escribe el JSON tal cual viene del secret
          printf '%s' "$LAUNCH_JSON" > launch.raw.json

          python - <<'PY'
          import json, os, sys

          # 1) Parsear
          raw = open('launch.raw.json', 'rb').read()
          try:
              d = json.loads(raw.decode('utf-8'))
          except Exception as e:
              print("ERROR: launch.json inválido:", e)
              sys.exit(1)

          print("=== launch.json (claves top-level) ===")
          for k in d:
              print(" -", k)

          # 2) Normalizar a camelCase (API shape)
          #    Acepta tanto kebab-case como camelCase como entrada
          def norm_key(k):
              return k.replace('-', '').lower()

          canonical = {}
          for k, v in d.items():
              canonical[norm_key(k)] = (k, v)

          def get(*names):
              for n in names:
                  if norm_key(n) in canonical:
                      return canonical[norm_key(n)][1]
              return None

          compartment = get('compartmentId', 'compartment-id')
          ad          = get('availabilityDomain', 'availability-domain')
          shape       = get('shape')
          shape_cfg   = get('shapeConfig', 'shape-config')
          source      = get('sourceDetails', 'source-details')
          vnic        = get('createVnicDetails', 'create-vnic-details')
          display     = get('displayName', 'display-name') or 'minecraft-server'
          metadata    = get('metadata') or {}

          if not all([compartment, ad, shape, shape_cfg, source, vnic]):
              print("ERROR: faltan claves obligatorias.")
              print("  compartment:", bool(compartment))
              print("  ad:         ", bool(ad))
              print("  shape:      ", bool(shape))
              print("  shape-config:", bool(shape_cfg))
              print("  source:     ", bool(source))
              print("  vnic:       ", bool(vnic))
              sys.exit(1)

          # 3) Normalizar nested shape-config
          shape_cfg_norm = {}
          for k, v in shape_cfg.items():
              shape_cfg_norm[norm_key(k)] = v
          ocpus = shape_cfg_norm.get('ocpus')
          mem   = shape_cfg_norm.get('memoryingbs') or shape_cfg_norm.get('memoryingb')
          if ocpus is None or mem is None:
              print("ERROR: shape-config necesita ocpus y memory-in-gbs"); sys.exit(1)

          # 4) Normalizar source-details
          src_norm = { norm_key(k): v for k, v in source.items() }
          source_type = src_norm.get('sourcetype')
          image_id    = src_norm.get('imageid')
          bv_size     = src_norm.get('bootvolumesizeingbs') or 50
          if not image_id:
              print("ERROR: source-details.image-id faltante"); sys.exit(1)

          # 5) Normalizar create-vnic-details
          vnic_norm = { norm_key(k): v for k, v in vnic.items() }
          subnet_id = vnic_norm.get('subnetid')
          assign_pub = vnic_norm.get('assignpublicip', True)
          if not subnet_id:
              print("ERROR: create-vnic-details.subnet-id faltante"); sys.exit(1)

          # 6) SSH key: prioridad al secret (más confiable)
          ssh_key = os.environ.get('OCI_SSH_PUBLIC_KEY', '').strip()
          if not ssh_key:
              ssh_key = metadata.get('ssh_authorized_keys', '').strip()
          if not ssh_key:
              print("ERROR: no hay SSH public key (ni secret ni metadata)"); sys.exit(1)

          # 7) Construir JSON final en camelCase (API shape)
          final = {
              "compartmentId":      compartment,
              "availabilityDomain": ad,
              "displayName":        display,
              "shape":              shape,
              "shapeConfig": {
                  "ocpus":       ocpus,
                  "memoryInGBs": mem,
              },
              "sourceDetails": {
                  "sourceType":          source_type or "image",
                  "imageId":             image_id,
                  "bootVolumeSizeInGBs": bv_size,
              },
              "createVnicDetails": {
                  "subnetId":       subnet_id,
                  "assignPublicIp": assign_pub,
              },
              "metadata": {
                  "ssh_authorized_keys": ssh_key,
              },
          }

          json.dump(final, open('launch.json', 'w'), indent=2)

          # 8) Print sanitizado
          print()
          print("=== launch.json normalizado (SSH redactada) ===")
          safe = json.loads(json.dumps(final))
          safe['metadata']['ssh_authorized_keys'] = \
              safe['metadata']['ssh_authorized_keys'][:30] + '...[redacted]'
          print(json.dumps(safe, indent=2))
          print()
          print("OK: launch.json listo.")
          PY

      - name: Run hunter
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION:       ${{ secrets.OCI_REGION }}
        run: |
          chmod +x ./hunter.sh
          ./hunter.sh

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-${{ github.run_id }}
          path: |
            launch.json
            launch.raw.json
            resultado.json
            hunter.log
          if-no-files-found: ignore
