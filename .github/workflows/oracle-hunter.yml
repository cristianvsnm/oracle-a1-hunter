name: Oracle A1 Flex Hunter

on:
  schedule:
    # Cada 15 minutos (mínimo razonable en GH Actions)
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Permite que solo uno corra a la vez
concurrency:
  group: oracle-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    # 5h 50m (el máximo de GH Actions es 6h)
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI CLI
        run: |
          pip install --quiet oci-cli
          oci --version

      - name: Configure OCI credentials
        env:
          OCI_FINGERPRINT:   ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY:   ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_TENANCY_OCID:  ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID:     ${{ secrets.OCI_USER_OCID }}
          OCI_REGION:        ${{ secrets.OCI_REGION }}
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 "$HOME/.oci/config"

      - name: Write launch.json
        env:
          LAUNCH_JSON: ${{ secrets.LAUNCH_JSON }}
        run: |
          printf '%s' "$LAUNCH_JSON" > launch.json
          # Validación rápida
          python -c "import json,sys; json.load(open('launch.json'))" \
            && echo "launch.json OK" \
            || { echo "launch.json inválido"; exit 1; }

      - name: Run hunter
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          chmod +x ./hunter.sh
          ./hunter.sh

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-${{ github.run_id }}
          path: |
            resultado.json
            hunter.log
          if-no-files-found: ignore
